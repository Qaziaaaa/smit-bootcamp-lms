# CI — runs on every push and pull request.
# Lints frontend, builds frontend + backend to catch errors before merge.
# Vercel handles CD (auto-deploys on merge to dev/main).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Install backend dependencies
      - name: Install backend
        run: npm ci
        working-directory: backend

      # Install frontend dependencies
      - name: Install frontend
        run: npm ci
        working-directory: frontend

      # Lint frontend (oxlint)
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      # Build frontend (catches import errors, syntax errors, type issues)
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Build backend (catches syntax errors, missing imports)
      - name: Build backend
        run: node --check src/server.js
        working-directory: backend
